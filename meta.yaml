{% set name = "jaffa" %}
{% set version = "2.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/yinshiyi/JAFFA/archive/refs/tags/version-{{ version }}.tar.gz
  sha256: 3af3c8a5c981e4999cae5216e69eb676945782cdea259a07038c4e0895cb2053
  patches:
    - jaffa.patch

build:
  number: 2
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
  - {{ compiler('cxx') }}
  run:
  - bpipe
  - oases
  - velvet
  - trimmomatic
  # Pinning to 1.1 is required as JAFFA does not know about new samtools sort syntax
  - samtools ==1.1
  - bowtie2
  # samtools 1.1 forces openssl 1.1; newer ucsc-* builds (>=466) declare only
  # libopenssl-static but dynamically link libssl.so.3, so they fail to load
  - ucsc-blat ==445
  - fastx_toolkit
  - bbmap
  - bioconductor-iranges
  - minimap2
  - blast
  # used only by prepare_jaffa_reference.sh
  - gffread
  - bedtools
  - ucsc-gtftogenepred ==447

# Testing JAFFA is impossible without many resource files.
#test:
#  commands:
#  - jaffa-direct || true
#  - jaffa-assembly || true
#  - jaffa-hybrid || true

about:
  home: "https://github.com/Oshlack/JAFFA"
  summary: >
    JAFFA is a multi-step pipeline that takes either raw RNA-Seq reads, or pre-assembled transcripts then searches
    for gene fusions.  This package contains the wrappers jaffa-direct, jaffa-assembly, and jaffa-hybrid.
    You can pass the "refSeq" parameter in the environment variables JAFFA_REF_BASE. Otherwise, pass any paramters
    to the wrappers as you would to the bpipe JAFFA_{method} call in the manual.
  license: "GPL-3.0-or-later"
  license_family: GPL
  license_file: LICENSE

extra:
  skip-lints:
    - missing_tests
